name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build installer
        shell: bash
        run: npm run dist:win 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Show build error
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "::error title=electron-builder::$(tail -n 60 build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: webm-to-mp4-setup
          path: dist/*.exe
